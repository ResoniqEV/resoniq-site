<style>

  .top-label { text-align:center; margin-bottom:28px; }
  .top-label h1 { font-size:13px; font-weight:700; letter-spacing:.22em; text-transform:uppercase; color:rgba(232,41,60,0.7); margin-bottom:6px; }
  .top-label p  { font-size:12px; color:rgba(255,255,255,0.2); letter-spacing:.06em; }
  .diagram { width:100%; border-radius:16px; overflow:hidden; }

<div class="wrap">
  <div class="top-label">
    <h1>Resoniq — Active Sound Architecture</h1>
    <p>Confidential · Patent Pending</p>

  <div class="diagram">
<svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" style="display:block;width:100%;">
<defs>

  <!-- Glow filters -->
  <filter id="gl" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="gl2" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="gl3" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <!-- Car body fill gradient -->
  <linearGradient id="bodyFill" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#0d1f38" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#060e1a" stop-opacity="0.3"/>
  </linearGradient>

  <!-- Line gradient (blue wireframe) -->
  <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#2a7fff" stop-opacity="0.5"/>
    <stop offset="40%"  stop-color="#5eb8ff" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#2a7fff" stop-opacity="0.5"/>
  </linearGradient>
  <linearGradient id="lgv" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#5eb8ff" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#2a7fff" stop-opacity="0.4"/>
  </linearGradient>

  <!-- Ambient glow behind car -->
  <radialGradient id="ambi" cx="50%" cy="65%" r="55%">
    <stop offset="0%"   stop-color="#0a1e38" stop-opacity="1"/>
    <stop offset="60%"  stop-color="#060e1a" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
  </radialGradient>

  <!-- Red ambient for sound zones -->
  <radialGradient id="redAmbi" cx="12%" cy="72%" r="28%">
    <stop offset="0%"   stop-color="#e8293c" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#e8293c" stop-opacity="0"/>
  </radialGradient>

  <!-- Grid pattern -->
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
    <path d="M44 0L0 0 0 44" fill="none" stroke="#151520" stroke-width="0.6"/>
  </pattern>

</defs>

<!-- ── BACKGROUND ── -->
<rect width="1000" height="460" fill="#09090b"/>
<rect width="1000" height="460" fill="url(#grid)" opacity="1"/>
